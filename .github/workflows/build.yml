name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Playwright for the smoke test
        run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm test
      - name: Build the Claude-artifact version (AI on, for testers)
        run: npm run build:artifact
      - uses: actions/upload-artifact@v4
        with: { name: web, path: "www\ndist/claude-artifact.html", retention-days: 14 }

  android:
    runs-on: ubuntu-latest
    needs: web
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # the Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME); Gradle fetches missing platforms
      - run: npm ci
      - run: npm run android
      - name: Debug APK (install on a test phone)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: android/app/build/outputs/apk/debug/*.apk, retention-days: 14 }
      # Signed bundle for Google Play — only when the upload-key secrets are set in the repository settings
      - name: Signed release bundle (AAB)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with: { name: app-release-aab, path: android/app/build/outputs/bundle/release/*.aab, retention-days: 30 }
